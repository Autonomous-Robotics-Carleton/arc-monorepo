# native_sim: the sync link runs over the host's own sockets (Zephyr's
# offloaded sockets), so the full stack runs on a laptop (ADR-0028)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
# the bridge runs on this machine too
CONFIG_ARC_SYNC_LINK_PEER="127.0.0.1"
# the controller UARTs (boards/native_sim.overlay), interrupt-driven as on the MCU
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# 1 kHz traffic needs a tick finer than the default 10 ms: a 1 ms sleep would last 10 to 20
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# the command bus: a loopback CAN device, bridged to the simulator over UDP
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y
CONFIG_ARC_SIM_CAN_BRIDGE=y
# the e-stop status input: an emulated GPIO the simulator drives over UDP
CONFIG_GPIO=y
CONFIG_ARC_SIM_ESTOP=y
# Placeholders for simulation only; the car's values are TBD (see app/Kconfig):
# 10 A of brake current, and the fake controllers' model (62 mm wheels, 13.5:1, 2 pole pairs)
CONFIG_ARC_CAN_BRAKE_CURRENT_MA=10000
CONFIG_ARC_CAN_ERPM_PER_MPS=8317
