name: Bug
description: Something in the software, website, docs or tooling doesn't work. For a hardware or firmware failure during a run, use Failure report.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Car software (ros/)
        - Firmware
        - Docs site
        - Website
        - Tooling or CI
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
