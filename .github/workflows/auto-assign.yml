name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request_target: # no code is checked out
    types: [opened, ready_for_review, reopened]

permissions:
  issues: write
  pull-requests: write

# Uses the REST "add assignees" endpoint (PRs are issues there): `gh pr edit`
# sends a heavy GraphQL query that GitHub sometimes answers with a 502.
jobs:
  assign:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Assign new issues to the maintainer
        if: github.event_name == 'issues'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: gh api -X POST "repos/$REPO/issues/$NUMBER/assignees" -f "assignees[]=HalfPast9" --silent

      - name: Assign PRs to their author
        if: github.event_name == 'pull_request_target'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh api -X POST "repos/$REPO/issues/$NUMBER/assignees" -f "assignees[]=$AUTHOR" --silent
