packages:
  - apps/*
  - libs/*

ignoredBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# Security fixes for packages whose parents pin a vulnerable version
# (Nx: axios, follow-redirects, smol-toml, brace-expansion; Next: postcss;
# fumadocs-docgen: zod). Drop each once its parent ships the fix.
overrides:
  axios@<1.20.0: ^1.20.0
  follow-redirects@<1.16.1: ^1.16.1
  smol-toml@<1.9.0: ^1.9.0
  brace-expansion@>=5.0.0 <5.0.10: ^5.0.10
  postcss@<8.5.18: ^8.5.18
  zod@>=4.0.0 <4.6.6: ^4.6.6
